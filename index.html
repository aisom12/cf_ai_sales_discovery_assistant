<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sales Discovery Assistant</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-inner">
          <div class="logo">⚡</div>
          <div>
            <h1>Sales Discovery Assistant</h1>
            <p class="subtitle">Powered by Llama 3.3 · Cloudflare Workers AI</p>
          </div>
        </div>
      </header>

      <div id="chat" role="log" aria-live="polite" aria-label="Conversation"></div>

      <div id="input-area">
        <div id="input-row">
          <textarea
            id="input"
            placeholder="Describe your prospect or ask a discovery question…"
            rows="1"
            aria-label="Your message"
          ></textarea>
          <button id="send-btn" aria-label="Send">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <p class="hint">Press Enter to send · Shift+Enter for new line</p>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
